# [LEARN] GitHub Actions est un outil de CI/CD intégré à GitHub.
# [LEARN] "CI" = Continuous Integration : à chaque push, on vérifie automatiquement
# [LEARN] que le code compile, passe le lint et les tests.
# [LEARN] Ça évite de merger du code cassé sur la branche principale.
# [LEARN]
# [LEARN] Ce fichier décrit un "workflow" : une série de jobs qui tournent
# [LEARN] sur des machines virtuelles GitHub (ubuntu-latest).
name: CI — Backend NestJS

# [LEARN] 'on' définit les événements qui déclenchent le workflow.
# [LEARN] Ici : sur chaque push sur main, et sur chaque Pull Request vers main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------
  # Job 1 : Build + Lint
  # ----------------------------------------------------------------
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      # [LEARN] actions/checkout récupère le code du repo sur la machine virtuelle.
      - name: Checkout code
        uses: actions/checkout@v4

      # [LEARN] actions/setup-node installe Node.js. 'cache: npm' met en cache
      # [LEARN] node_modules entre les runs pour accélérer les pipelines suivants.
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test -- --passWithNoTests
        env:
          # [LEARN] En CI, les tests ont besoin des variables d'env.
          # [LEARN] Ces valeurs sont des placeholders — on ne connecte pas à une vraie DB en CI.
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: ecommerce_blog_test
          JWT_SECRET: ci_test_secret
          JWT_EXPIRES_IN: 7d
          PORT: 3301

  # ----------------------------------------------------------------
  # Job 2 : Analyse qualité SonarCloud
  # ----------------------------------------------------------------
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    # [LEARN] 'needs' crée une dépendance : SonarCloud ne tourne que si le build passe.
    # [LEARN] Ça évite d'analyser du code qui ne compile même pas.
    needs: build-and-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # [LEARN] fetch-depth: 0 récupère TOUT l'historique git.
          # [LEARN] SonarCloud en a besoin pour calculer la "new code" vs "old code"
          # [LEARN] et mesurer l'évolution de la qualité dans le temps.
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # [LEARN] SONAR_TOKEN est un secret à ajouter manuellement dans :
          # [LEARN] GitHub → Settings → Secrets and variables → Actions → New secret
          # [LEARN] La valeur se récupère sur sonarcloud.io après avoir créé le projet.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
